{{- if .Values.route.enabled -}}
{{- $fullName := include "paperless.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
{{- range .Values.route.hostnames }}
    - {{ . | quote }}
{{- end }}
  parentRefs:
{{- with .Values.route.parentRefs }}
    {{- toYaml . | nindent 4 }}
{{- end }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
